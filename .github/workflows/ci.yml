name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/validex/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: cmd/validex/frontend
        run: npm ci

      - name: Check frontend
        working-directory: cmd/validex/frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Test Go packages
        run: |
          go test ./...
          go vet ./...

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/validex/frontend/package-lock.json

      - name: Test native bridge
        run: |
          go test -tags canbridge ./internal/canbridge ./cmd/validex
          go vet -tags canbridge ./internal/canbridge ./cmd/validex

      - name: Build native application
        run: make build
